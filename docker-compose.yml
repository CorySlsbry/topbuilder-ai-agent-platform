# =============================================================================
# Top Builder AI — local development stack
#   docker compose up --build
#
#   db  : Postgres 16 + pgvector (mirrors Supabase: RLS + vector in one place)
#   api : FastAPI + LangGraph (runs migrations on boot, then serves)
#   web : Next.js dashboard
#
# RLS note: `api` connects as the non-superuser `app_user`; migrations run as
# the `postgres` superuser. That split is what makes RLS real. See adr/0002.
# =============================================================================
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fieldops
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fieldops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      ENV: dev
      LOG_LEVEL: INFO
      API_PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://app_user:app_pw@db:5432/fieldops
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@db:5432/fieldops
      JWT_SECRET: dev-secret-do-not-use-in-prod
      JWT_ISSUER: fieldops-iq
      JWT_AUDIENCE: fieldops-api
      JWT_EXPIRY_MINUTES: "60"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WORKFORCE_REASONING_MODEL: claude-sonnet-4-6
      DISABLE_LLM: ${DISABLE_LLM:-1}
      SERVICETITAN_MODE: fixture
      ACCOUNTING_MODE: fixture
      INVENTORY_MODE: fixture
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:REDACTED}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-dev-webhook-secret}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  db_data:
