<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Top Builder AI">
  <defs>
    <linearGradient id="tbaiGrad" x1="8" y1="8" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="88" height="88" rx="23" fill="url(#tbaiGrad)"/>
  <!-- ascending "builder" bars: floors rising = growth -->
  <rect x="28" y="58" width="12" height="20" rx="4.5" fill="#fff" opacity=".82"/>
  <rect x="44" y="46" width="12" height="32" rx="4.5" fill="#fff" opacity=".92"/>
  <rect x="60" y="34" width="12" height="44" rx="4.5" fill="#fff"/>
  <!-- apex learning node: the AI that gets smarter -->
  <circle cx="66" cy="25" r="7.5" fill="#fff"/>
</svg>
