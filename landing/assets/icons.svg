      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 7.2V12l3.4 2.2"/>
    </symbol>
    <symbol id="tb-moon" viewBox="0 0 24 24">
