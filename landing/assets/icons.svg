<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- ==========================================================================
    Top Builder OS icon sprite — style 8 "live line", blue (Cory 2026-08-13).
    ONE source for the marketing site AND the OS app. Rules:
      - 24x24 grid, stroke = currentColor (the page decides the blue), 1.8pt,
        round caps. No fills except deliberate accents.
      - every stroke carries fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" so motion.css can draw it in on reveal;
        without motion.css/js the glyph renders fully drawn (safe default).
      - NO status dots baked in. A dot is status, not subject — pages add
        <circle class="tbi-dot"> (marketing) or a real badge (app) only where
        something is actually live.
    Usage: <svg class="tbi"><use href="/assets/icons.svg#tb-ledger"/></svg>
  ========================================================================== -->
  <defs>

    <!-- ── the trade ─────────────────────────────────────────────────── -->
    <symbol id="tb-crane" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M7 21V4M3.5 21h7M3.5 4h17M7 4l6.5 5.5M17 4v6.5"/>
      <rect fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" x="14.4" y="10.5" width="5.2" height="3.4" rx="1"/>
    </symbol>
    <symbol id="tb-hardhat" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 15.5a7 7 0 0 1 14 0"/>
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2.5 15.5h19"/>
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M10 9.2V6.5a2 2 0 0 1 4 0v2.7"/>
    </symbol>
    <symbol id="tb-wrench" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 6.2a4.3 4.3 0 0 0-5.8 5.8L4 17.2 6.8 20l5.2-5.2a4.3 4.3 0 0 0 5.8-5.8l-2.7 2.7-2.4-.7-.7-2.4z"/>
    </symbol>
    <symbol id="tb-truck" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2.5 6.5h11v10h-11zM13.5 10h4l3 3.2v3.3h-7"/>
      <circle fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" cx="7" cy="18.4" r="1.9"/>
      <circle fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" cx="17" cy="18.4" r="1.9"/>
    </symbol>
    <symbol id="tb-calendar" viewBox="0 0 24 24">
